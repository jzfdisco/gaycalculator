<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>名字gay指数计算器</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Microsoft Yahei",sans-serif;
}
body{
  min-height:100vh;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:40px;
  padding:20px;
}
.title{
  font-size:42px;
  font-weight:bold;
  background:linear-gradient(90deg,#ff4466,#ffbb22,#44dd66,#22aaff,#aa66ff,#ff4466);
  background-size:400% 400%;
  -webkit-background-clip:text;
  color:transparent;
  animation: rainbow 3s ease-in-out infinite, bounce 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite alternate;
}
@keyframes rainbow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes bounce{
  0%{transform: translateY(0px) scale(1)}
  100%{transform: translateY(-12px) scale(1.04)}
}
.box{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
}
#nameInput{
  width:320px;
  padding:14px 18px;
  font-size:20px;
  border:none;
  border-radius:12px;
  outline:none;
  transition:0.25s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
#nameInput:focus{
  transform:scale(1.07);
  box-shadow:0 0 20px #ff77bb;
}
#calcBtn{
  padding:14px 36px;
  font-size:20px;
  border:none;
  border-radius:12px;
  color:white;
  background:linear-gradient(45deg,#ff3377,#33ccff,#bb55ff);
  background-size:200% 200%;
  cursor:pointer;
  animation: btnGrad 2s ease infinite;
  transition:0.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
@keyframes btnGrad{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
#calcBtn:active{
  transform:scale(0.92);
}

/* 自定义弹窗 */
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.3s ease;
}
.modal-mask.show{
  opacity:1;
  pointer-events:auto;
}
.modal-card{
  background:linear-gradient(135deg,#ff4477,#44aaff,#aa55ff);
  padding:36px 48px;
  border-radius:20px;
  text-align:center;
  color:#fff;
  transform: scale(0.2);
  transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.modal-mask.show .modal-card{
  transform: scale(1);
}
.modal-card .result-text{
  font-size:28px;
  margin-bottom:24px;
  font-weight:bold;
}
.modal-card .close-btn{
  padding:10px 28px;
  border:none;
  border-radius:999px;
  font-size:18px;
  cursor:pointer;
  color:#222;
  background:#fff;
  transition:0.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.modal-card .close-btn:hover{
  transform:scale(1.08);
}
</style>
</head>
<body>
  <div class="title">名字gay指数计算器</div>
  <div class="box">
    <input type="text" id="nameInput" placeholder="在这里输入名字">
    <button id="calcBtn">开始计算</button>
  </div>

  <!-- 页面内部弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal-card">
      <div class="result-text" id="resultText"></div>
      <button class="close-btn" id="closeBtn">关闭</button>
    </div>
  </div>

<script>
function getHashScore(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  const num = Math.abs(hash) % 101;
  return num;
}

const btn = document.getElementById('calcBtn');
const input = document.getElementById('nameInput');
const modal = document.getElementById('modal');
const resultText = document.getElementById('resultText');
const closeBtn = document.getElementById('closeBtn');

btn.onclick = function(){
  const name = input.value.trim();
  if(!name){
    resultText.innerText = "请先输入名字！";
  }else{
    const score = getHashScore(name);
    resultText.innerText = `【${name}】的gay指数：${score}%`;
  }
  modal.classList.add('show');
}

closeBtn.onclick = function(){
  modal.classList.remove('show');
}
// 点击遮罩也可以关闭弹窗
modal.onclick = function(e){
  if(e.target === modal){
    modal.classList.remove('show');
  }
}
</script>
</body>
</html>
